name: project
description: "Food Recognizer App - Flutter ML Food Classification"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Image Picking & Cropping
  image_picker: ^1.1.2
  image_cropper: ^9.0.0

  # Camera
  camera: ^0.11.1

  # Image Processing
  image: ^4.5.3

  # TFLite
  tflite_flutter: ^0.11.0

  # Networking
  http: ^1.4.0

  # Gemini AI
  google_generative_ai: ^0.4.6

  # File system
  path_provider: ^2.1.5
  path: ^1.9.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_ml_model_downloader: ^0.3.3+8

  # Flutter dotenv for API keys
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/models/
    - .env
